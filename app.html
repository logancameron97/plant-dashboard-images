<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plant Care">

<link
  rel="apple-touch-icon"
  sizes="180x180"
  href="https://raw.githubusercontent.com/logancameron97/plant-dashboard-images/main/applogo.png"
>

<title>Plant Care</title>

<style>
html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#eaf2ed;
}

iframe{
  display:block;
  width:100%;
  height:100%;
  border:0;
}
</style>
</head>

<body>

<iframe
  id="appFrame"
  title="Plant Care"
  allow="camera"
></iframe>

<script>
const APPS_SCRIPT_URL=
  'https://script.google.com/macros/s/AKfycbyAwA-vQVo4DRhlkrIQCN5lHUrXifpexpeZ2FxWmid7M_KcALGA6iRlz0U7tdzK5RzK/exec';

const incoming=
  new URLSearchParams(
    window.location.search
  );

const outgoing=
  new URLSearchParams();

[
  'scan',
  'labelsGenerated',
  'batchWater',
  'view'
].forEach(key=>{
  const value=
    incoming.get(key);

  if(value){
    outgoing.set(
      key,
      value
    );
  }
});

const iframeUrl=
  APPS_SCRIPT_URL+
  (
    outgoing.toString()
      ?'?'+outgoing.toString()
      :''
  );

document.getElementById(
  'appFrame'
).src=
  iframeUrl;

/*
Clean temporary scanner/label parameters
from the outer URL after handing them to
Apps Script.

This prevents refreshing the app from
re-saving an old Quick Water batch.
*/
if(incoming.toString()){
  history.replaceState(
    {},
    document.title,
    window.location.pathname
  );
}
</script>

</body>
</html>
