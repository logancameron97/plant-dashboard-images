<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plant Care">

<link
  rel="apple-touch-icon"
  sizes="180x180"
  href="https://raw.githubusercontent.com/logancameron97/plant-dashboard-images/main/applogo.png"
>

<title>Plant Care</title>

<style>
html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#eef5f0;
}

#app{
  display:block;
  width:100%;
  height:100%;
  border:0;
}
</style>
</head>

<body>

<iframe id="app"></iframe>

<script>
const APPS_SCRIPT_URL=
  'https://script.google.com/macros/s/AKfycbyAwA-vQVo4DRhlkrIQCN5lHUrXifpexpeZ2FxWmid7M_KcALGA6iRlz0U7tdzK5RzK/exec?view=phone';

const params=
  new URLSearchParams(
    window.location.search
  );

const scan=
  params.get('scan');

const action=
  params.get('action');

const labelsGenerated=
  params.get('labelsGenerated');

let url=APPS_SCRIPT_URL;

if(scan){
  url+=
    '&scan='+
    encodeURIComponent(scan);
}

if(action){
  url+=
    '&action='+
    encodeURIComponent(action);
}

if(labelsGenerated){
  url+=
    '&labelsGenerated='+
    encodeURIComponent(labelsGenerated);
}

document.getElementById('app').src=url;

if(scan||action||labelsGenerated){
  history.replaceState(
    {},
    '',
    window.location.pathname
  );
}
</script>

</body>
</html>
