<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
>
<meta name="theme-color" content="#eaf2ed">

<title>Plant Scanner</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
:root{
  --bg:#eaf2ed;
  --card:#fff;
  --text:#243b31;
  --muted:#718278;
  --border:#d5e0da;
  --green:#6fa982;
  --blue:#6baed6;
  --blue-dark:#477f9f;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

html,
body{
  min-height:100%;
}

body{
  padding:
    max(18px,env(safe-area-inset-top))
    16px
    max(18px,env(safe-area-inset-bottom));

  background:
    radial-gradient(
      circle at top,
      rgba(255,255,255,.9),
      transparent 36%
    ),
    var(--bg);

  color:var(--text);
}

.shell{
  width:100%;
  max-width:460px;
  margin:0 auto;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
}

.header-title{
  font-size:1.25rem;
  font-weight:900;
}

.mode-chip{
  display:none;
  padding:5px 8px;
  border-radius:999px;
  background:#e7f4fb;
  border:1px solid #b9d8e9;
  color:#397fa9;
  font-size:.65rem;
  font-weight:850;
  text-transform:uppercase;
  letter-spacing:.45px;
}

.water-mode .mode-chip{
  display:inline-flex;
}

.card{
  padding:12px;
  background:rgba(255,255,255,.9);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:0 10px 28px rgba(55,80,66,.11);
}

#reader{
  width:100%;
  aspect-ratio:1/1;
  overflow:hidden;
  background:#000;
  border-radius:15px;
}

#reader video{
  display:block!important;
  width:100%!important;
  height:100%!important;
  min-height:0!important;
  max-height:none!important;
  object-fit:cover!important;
}

#reader img{
  display:none!important;
}

.scan-hint{
  margin:11px 2px 0;
  color:var(--muted);
  font-size:.76rem;
  line-height:1.35;
  text-align:center;
}

.feedback{
  min-height:32px;
  margin-top:8px;
  padding:7px 10px;
  border-radius:9px;
  font-size:.75rem;
  font-weight:800;
  text-align:center;
  opacity:0;
  transform:translateY(-3px);
  transition:.18s ease;
}

.feedback.show{
  opacity:1;
  transform:translateY(0);
}

.feedback.success{
  background:#e9f5ed;
  color:#477b58;
}

.feedback.warning{
  background:#fff4df;
  color:#946d29;
}

.manual{
  margin-top:14px;
  padding:12px;
  background:rgba(255,255,255,.74);
  border:1px solid var(--border);
  border-radius:14px;
}

.manual-title{
  margin-bottom:7px;
  color:#5e7267;
  font-size:.72rem;
  font-weight:850;
}

.manual-row{
  display:flex;
  gap:7px;
}

.manual input{
  flex:1;
  min-width:0;
  padding:10px 11px;
  border:1px solid #ccd9d2;
  border-radius:9px;
  background:#fff;
  color:var(--text);
  font-size:1rem;
  text-transform:uppercase;
}

button{
  border:0;
  border-radius:9px;
  font-size:.8rem;
  font-weight:850;
  cursor:pointer;
  touch-action:manipulation;
}

.manual button{
  padding:9px 12px;
  background:#8297a8;
  color:#fff;
}

.batch{
  display:none;
  margin-top:14px;
}

.water-mode .batch{
  display:block;
}

.batch-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:7px;
}

.batch-title{
  color:#5f786b;
  font-size:.72rem;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.7px;
}

.batch-count{
  padding:4px 7px;
  border-radius:999px;
  background:#edf4f0;
  color:#60776a;
  font-size:.62rem;
  font-weight:850;
}

.batch-list{
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:11px;
  background:#fff;
}

.batch-empty{
  padding:13px;
  color:#87978e;
  font-size:.72rem;
  text-align:center;
}

.batch-row{
  display:grid;
  grid-template-columns:minmax(70px,.75fr) minmax(0,1.25fr) 24px;
  align-items:center;
  gap:6px;
  min-height:36px;
  padding:6px 8px;
  font-size:.69rem;
}

.batch-row + .batch-row{
  border-top:1px solid #edf1ef;
}

.batch-id{
  color:#314a3e;
  font-weight:900;
}

.batch-time{
  min-width:0;
  color:#75867d;
  font-size:.65rem;
  white-space:nowrap;
}

.batch-remove{
  width:23px;
  height:23px;
  padding:0;
  border-radius:50%;
  background:#eef2f0;
  color:#7e8d85;
  font-size:.8rem;
}

.footer-actions{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
  margin-top:15px;
}

.water-mode .footer-actions{
  grid-template-columns:1fr 1fr;
}

.cancel{
  padding:11px;
  background:#8fa39a;
  color:#fff;
}

.save{
  display:none;
  padding:11px;
  background:var(--blue);
  color:#fff;
}

.water-mode .save{
  display:block;
}

.save:disabled{
  opacity:.45;
}

.camera-error{
  display:none;
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  background:#faeeee;
  color:#955454;
  font-size:.72rem;
  line-height:1.35;
}
</style>
</head>

<body>

<div class="shell" id="shell">

  <div class="header">
    <div class="header-title" id="pageTitle">Scan Plant</div>
    <div class="mode-chip">Quick Water</div>
  </div>

  <div class="card">

    <div id="reader"></div>

    <div class="scan-hint" id="scanHint">
      Point the camera at a plant QR tag.
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="camera-error" id="cameraError"></div>

  </div>

  <div class="manual">

    <div class="manual-title">
      Can't scan tag?
    </div>

    <div class="manual-row">

      <input
        id="manualId"
        type="text"
        inputmode="text"
        autocomplete="off"
        autocapitalize="characters"
        placeholder="P-001"
        maxlength="10"
      >

      <button
        type="button"
        onclick="submitManualId()"
      >
        Add
      </button>

    </div>

  </div>

  <div class="batch">

    <div class="batch-heading">

      <div class="batch-title">
        Watering Queue
      </div>

      <div
        class="batch-count"
        id="batchCount"
      >
        0 plants
      </div>

    </div>

    <div
      class="batch-list"
      id="batchList"
    >
      <div class="batch-empty">
        Scan your first plant.
      </div>
    </div>

  </div>

  <div class="footer-actions">

    <button
      class="cancel"
      type="button"
      onclick="cancelScanner()"
    >
      Cancel
    </button>

    <button
      class="save"
      id="saveButton"
      type="button"
      onclick="saveQuickWater()"
      disabled
    >
      Save
    </button>

  </div>

</div>

<script>
const APP_URL=
  'https://logancameron97.github.io/plant-dashboard-images/app.html';

const params=
  new URLSearchParams(
    window.location.search
  );

const QUICK_WATER=
  params.get('mode')==='water';

let scanner=null;
let scanQueue=[];
let lastDetectedId='';
let lastDetectedAt=0;
let feedbackTimer=null;
let scanLocked=false;

document.addEventListener(
  'DOMContentLoaded',
  init
);

async function init(){
  if(QUICK_WATER){
    document.body.classList.add(
      'water-mode'
    );

    document.getElementById(
      'pageTitle'
    ).textContent=
      'Quick Water';

    document.getElementById(
      'scanHint'
    ).textContent=
      'Scan plants continuously. Nothing is saved until you tap Save.';
  }

  renderBatch();

  if(!window.Html5Qrcode){
    showCameraError(
      'QR scanner library could not be loaded.'
    );
    return;
  }

  scanner=
    new Html5Qrcode(
      'reader'
    );

  try{
    await scanner.start(
      {
        facingMode:'environment'
      },
      {
        fps:20,
        disableFlip:true,
        formatsToSupport:[
          Html5QrcodeSupportedFormats.QR_CODE
        ]
      },
      handleScanSuccess,
      ()=>{}
    );
  }catch(error){
    console.error(error);

    showCameraError(
      'Camera access was denied or the camera is unavailable. You can still enter the plant ID manually below.'
    );
  }
}

function normalizePlantId(value){
  const match=
    String(value||'')
      .trim()
      .toUpperCase()
      .match(/\bP-\d{3,}\b/);

  return match
    ?match[0]
    :'';
}

function handleScanSuccess(decodedText){
  const plantId=
    normalizePlantId(decodedText);

  if(!plantId){
    return;
  }

  const now=Date.now();

  /*
  Prevent the camera from repeatedly
  reading the same visible QR every frame.
  */
  if(
    plantId===lastDetectedId&&
    now-lastDetectedAt<1800
  ){
    return;
  }

  lastDetectedId=plantId;
  lastDetectedAt=now;

  if(QUICK_WATER){
    addToWaterQueue(
      plantId,
      new Date()
    );

    return;
  }

  if(scanLocked){
    return;
  }

  scanLocked=true;

  redirectNormalScan(
    plantId
  );
}

function submitManualId(){
  const input=
    document.getElementById(
      'manualId'
    );

  const plantId=
    normalizePlantId(
      input.value
    );

  if(!plantId){
    showFeedback(
      'Enter a valid plant ID such as P-001.',
      'warning'
    );

    return;
  }

  input.value='';

  if(QUICK_WATER){
    addToWaterQueue(
      plantId,
      new Date()
    );

    return;
  }

  redirectNormalScan(
    plantId
  );
}

function addToWaterQueue(
  plantId,
  timestamp
){
  const existing=
    scanQueue.find(
      item=>
        item.plantId===
        plantId
    );

  if(existing){
    showFeedback(
      plantId+
      ' is already in the queue.',
      'warning'
    );

    if(navigator.vibrate){
      navigator.vibrate(
        [30,40,30]
      );
    }

    return;
  }

  scanQueue.push({
    plantId:plantId,
    wateredAt:
      timestamp.toISOString()
  });

  if(navigator.vibrate){
    navigator.vibrate(65);
  }

  showFeedback(
    '✓ '+
    plantId+
    ' added',
    'success'
  );

  renderBatch();
}

function removeQueuedPlant(
  plantId
){
  scanQueue=
    scanQueue.filter(
      item=>
        item.plantId!==
        plantId
    );

  renderBatch();
}

function renderBatch(){
  const list=
    document.getElementById(
      'batchList'
    );

  const count=
    document.getElementById(
      'batchCount'
    );

  const save=
    document.getElementById(
      'saveButton'
    );

  if(!list||!count||!save){
    return;
  }

  count.textContent=
    scanQueue.length+
    (
      scanQueue.length===1
        ?' plant'
        :' plants'
    );

  save.disabled=
    scanQueue.length===0;

  if(!scanQueue.length){
    list.innerHTML=
      '<div class="batch-empty">'+
      'Scan your first plant.'+
      '</div>';

    return;
  }

  list.innerHTML=
    scanQueue
      .map(item=>{
        const date=
          new Date(
            item.wateredAt
          );

        const time=
          date.toLocaleTimeString(
            [],
            {
              hour:'2-digit',
              minute:'2-digit',
              second:'2-digit'
            }
          );

        return(
          '<div class="batch-row">'+

            '<div class="batch-id">'+
              escapeHtml(
                item.plantId
              )+
            '</div>'+

            '<div class="batch-time">'+
              'Watered at: '+
              escapeHtml(time)+
            '</div>'+

            '<button '+
              'class="batch-remove" '+
              'type="button" '+
              'aria-label="Remove '+escapeHtml(item.plantId)+'" '+
              'onclick="removeQueuedPlant(\''+
                escapeJs(
                  item.plantId
                )+
              '\')">'+
              '×'+
            '</button>'+

          '</div>'
        );
      })
      .join('');
}

function showFeedback(
  message,
  type
){
  const feedback=
    document.getElementById(
      'feedback'
    );

  feedback.textContent=
    message;

  feedback.className=
    'feedback show '+
    (
      type||
      'success'
    );

  clearTimeout(
    feedbackTimer
  );

  feedbackTimer=
    setTimeout(()=>{
      feedback.className=
        'feedback';
    },950);
}

function showCameraError(
  message
){
  const error=
    document.getElementById(
      'cameraError'
    );

  error.textContent=
    message;

  error.style.display=
    'block';
}

async function stopScanner(){
  if(!scanner){
    return;
  }

  try{
    await scanner.stop();
  }catch(error){}

  try{
    scanner.clear();
  }catch(error){}

  scanner=null;
}

async function redirectNormalScan(
  plantId
){
  await stopScanner();

  window.location.href=
    APP_URL+
    '?scan='+
    encodeURIComponent(
      plantId
    );
}

async function saveQuickWater(){
  if(!scanQueue.length){
    return;
  }

  document.getElementById(
    'saveButton'
  ).disabled=
    true;

  await stopScanner();

  /*
  Compact URL format:
  P-001|ISO,P-002|ISO,...
  */
  const batch=
    scanQueue
      .map(item=>
        item.plantId+
        '|'+
        item.wateredAt
      )
      .join(',');

  window.location.href=
    APP_URL+
    '?batchWater='+
    encodeURIComponent(
      batch
    );
}

async function cancelScanner(){
  await stopScanner();

  window.location.href=
    APP_URL;
}

function escapeHtml(value){
  return String(value??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function escapeJs(value){
  return String(value??'')
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'");
}
</script>

</body>
</html>
