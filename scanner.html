<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Scan Plant</title>

<style>
:root{
  --bg:#eef5f0;
  --card:#fff;
  --text:#294136;
  --muted:#74877d;
  --border:#dbe7df;
  --green:#6fa982;
  --soft:#f6faf7;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}

html,body{
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
}

body{
  min-height:100dvh;
  padding:
    max(18px,env(safe-area-inset-top))
    18px
    max(18px,env(safe-area-inset-bottom));
}

.wrapper{
  width:100%;
  max-width:520px;
  margin:0 auto;
}

.header{
  margin-bottom:18px;
  text-align:center;
}

.icon{
  margin-bottom:6px;
  font-size:2rem;
}

h1{
  font-size:1.45rem;
}

.subtitle{
  margin-top:6px;
  color:var(--muted);
  font-size:.9rem;
  line-height:1.4;
}

.scanner-card{
  overflow:hidden;
  padding:12px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px;
  box-shadow:0 12px 35px rgba(50,75,62,.12);
}

#reader{
  width:100%;
  min-height:320px;
  overflow:hidden;
  background:#111;
  border-radius:17px;
}

#reader video{
  width:100%!important;
  object-fit:cover!important;
}

.status{
  min-height:45px;
  margin-top:14px;
  padding:11px 13px;
  background:var(--soft);
  border-radius:11px;
  color:var(--muted);
  font-size:.85rem;
  line-height:1.4;
  text-align:center;
}

.status.success{
  background:#e9f5ed;
  color:#4f8f63;
  font-weight:700;
}

.status.error{
  background:#faeeee;
  color:#a35858;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:12px;
}

button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:11px;
  font-size:.9rem;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:var(--green);
  color:#fff;
}

.secondary{
  background:#dfe8e2;
  color:var(--text);
}

.tip{
  margin-top:16px;
  color:var(--muted);
  font-size:.78rem;
  line-height:1.5;
  text-align:center;
}

#startButton{
  display:none;
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="header">
    <div class="icon">🌿</div>
    <h1>Scan Plant</h1>

    <div class="subtitle">
      Point the rear camera at the plant tag.
    </div>
  </div>

  <div class="scanner-card">

    <div id="reader"></div>

    <div class="status" id="status">
      Starting camera…
    </div>

    <div class="actions">

      <button
        class="primary"
        id="startButton"
        type="button"
        onclick="startScanner()"
      >
        Start Camera
      </button>

      <button
        class="secondary"
        type="button"
        onclick="returnToDashboard()"
      >
        Cancel
      </button>

    </div>

  </div>

  <div class="tip">
    Move the phone closer until the code fills most of the scan box.
    The scanner accepts Data Matrix or QR codes containing IDs such as
    <strong>P-001</strong>.
  </div>

</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
const DASHBOARD_URL=
  'https://script.google.com/macros/s/AKfycbyAwA-vQVo4DRhlkrIQCN5lHUrXifpexpeZ2FxWmid7M_KcALGA6iRlz0U7tdzK5RzK/exec?view=phone';

let scanner=null;
let scannerRunning=false;
let scanComplete=false;

document.addEventListener(
  'DOMContentLoaded',
  ()=>{
    setTimeout(
      startScanner,
      300
    );
  }
);

async function startScanner(){
  if(scannerRunning||scanComplete){
    return;
  }

  const startButton=
    document.getElementById(
      'startButton'
    );

  startButton.style.display='none';

  setStatus(
    'Requesting camera access…'
  );

  try{
    if(typeof Html5Qrcode==='undefined'){
      throw new Error(
        'Scanner library did not load.'
      );
    }

    scanner=
      new Html5Qrcode(
        'reader',
        {
          formatsToSupport:[
            Html5QrcodeSupportedFormats.DATA_MATRIX,
            Html5QrcodeSupportedFormats.QR_CODE
          ]
        }
      );

    const config={
      fps:15,

      qrbox:(
        viewfinderWidth,
        viewfinderHeight
      )=>{
        const available=
          Math.min(
            viewfinderWidth,
            viewfinderHeight
          );

        const size=
          Math.min(
            280,
            Math.max(
              180,
              Math.floor(
                available*.7
              )
            )
          );

        return {
          width:size,
          height:size
        };
      },

      disableFlip:true
    };

    await scanner.start(
      {
        facingMode:'environment'
      },
      config,
      handleScanSuccess,
      ()=>{}
    );

    scannerRunning=true;

    setStatus(
      'Camera ready — scan a plant tag.'
    );

  }catch(error){
    console.error(error);

    scannerRunning=false;

    setStatus(
      'Camera could not start: '+
      getErrorMessage(error),
      'error'
    );

    startButton.style.display='block';
    startButton.textContent='Try Again';
  }
}

async function handleScanSuccess(
  decodedText,
  decodedResult
){
  if(scanComplete){
    return;
  }

  const plantId=
    normalizePlantId(
      decodedText
    );

  if(!plantId){
    setStatus(
      'Code detected, but it does not contain a valid plant ID. Expected something like P-001.',
      'error'
    );

    return;
  }

  scanComplete=true;

  setStatus(
    '✓ '+plantId+' scanned',
    'success'
  );

  if(navigator.vibrate){
    navigator.vibrate(80);
  }

  try{
    if(
      scanner&&
      scannerRunning
    ){
      await scanner.stop();
      scannerRunning=false;
    }
  }catch(error){
    console.log(
      'Scanner stop:',
      error
    );
  }

  setTimeout(
    ()=>{
      const returnUrl=
        DASHBOARD_URL+
        '&scan='+
        encodeURIComponent(
          plantId
        );

      window.location.replace(
        returnUrl
      );
    },
    350
  );
}

function normalizePlantId(value){
  const text=
    String(value||'')
      .trim()
      .toUpperCase();

  const match=
    text.match(
      /\bP-\d{3,}\b/
    );

  return match
    ?match[0]
    :'';
}

async function returnToDashboard(){
  try{
    if(
      scanner&&
      scannerRunning
    ){
      await scanner.stop();
    }
  }catch(error){}

  window.location.replace(
    DASHBOARD_URL
  );
}

function setStatus(
  message,
  type=''
){
  const status=
    document.getElementById(
      'status'
    );

  status.textContent=message;

  status.className=
    'status'+
    (
      type
        ?' '+type
        :''
    );
}

function getErrorMessage(error){
  if(!error){
    return 'Unknown camera error.';
  }

  if(typeof error==='string'){
    return error;
  }

  return error.message||
    error.name||
    String(error);
}
</script>

</body>
</html>
