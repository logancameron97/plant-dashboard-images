<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<title>Scan Plant</title>

<style>
:root{
  --bg:#eef5f0;
  --card:#fff;
  --text:#294136;
  --muted:#74877d;
  --border:#dbe7df;
  --green:#6fa982;
  --green-soft:#e9f5ed;
  --soft:#f6faf7;
  --red:#a35858;
  --red-soft:#faeeee;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}

html,
body{
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
}

body{
  min-height:100dvh;

  padding:
    max(16px,env(safe-area-inset-top))
    16px
    max(18px,env(safe-area-inset-bottom));
}

.wrapper{
  width:100%;
  max-width:520px;
  margin:auto;
}

.header{
  margin-bottom:15px;
  text-align:center;
}

.icon{
  font-size:1.9rem;
}

h1{
  font-size:1.4rem;
}

.subtitle{
  margin-top:5px;
  color:var(--muted);
  font-size:.83rem;
}

.scanner-card{
  padding:11px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  box-shadow:0 10px 30px rgba(50,75,62,.1);
}


/* ==================================
   CAMERA

   No fixed height here.
   Let the video determine its natural
   aspect ratio so we don't leave a
   large unused black section.
================================== */

#reader{
  width:100%;
  overflow:hidden;
  background:#000;
  border-radius:15px;
}

#reader video{
  display:block!important;
  width:100%!important;
  height:auto!important;
  max-height:none!important;
  object-fit:contain!important;
}

#reader img{
  display:none!important;
}


/* ==================================
   STATUS
================================== */

.status{
  min-height:42px;
  margin-top:11px;
  padding:10px;
  background:var(--soft);
  border-radius:10px;
  color:var(--muted);
  font-size:.8rem;
  line-height:1.35;
  text-align:center;
}

.status.success{
  background:var(--green-soft);
  color:#4f8f63;
  font-weight:700;
}

.status.error{
  background:var(--red-soft);
  color:var(--red);
}


/* ==================================
   MANUAL FALLBACK
================================== */

.manual{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid var(--border);
}

.manual-label{
  margin-bottom:6px;
  color:var(--muted);
  font-size:.75rem;
  font-weight:700;
}

.manual-row{
  display:flex;
  gap:7px;
}

.manual-row input{
  flex:1;
  min-width:0;
  padding:11px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--soft);
  color:var(--text);
  font-size:1rem;
  text-transform:uppercase;
}

button{
  border:0;
  cursor:pointer;
}

.manual-button{
  padding:0 16px;
  border-radius:10px;
  background:var(--green);
  color:#fff;
  font-weight:700;
}


/* ==================================
   BUTTONS
================================== */

.bottom-actions{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.bottom-actions button{
  flex:1;
  padding:11px;
  border-radius:10px;
  font-size:.82rem;
  font-weight:700;
}

.retry{
  display:none;
  background:var(--green);
  color:#fff;
}

.cancel{
  background:#dfe8e2;
  color:var(--text);
}

.tip{
  margin-top:12px;
  color:var(--muted);
  font-size:.72rem;
  line-height:1.4;
  text-align:center;
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="header">

    <div class="icon">
      🌿
    </div>

    <h1>
      Scan Plant
    </h1>

    <div class="subtitle">
      Scan the plant tag, then choose what you did.
    </div>

  </div>

  <div class="scanner-card">

    <div id="reader"></div>

    <div
      class="status"
      id="status"
    >
      Starting camera…
    </div>

    <div class="manual">

      <div class="manual-label">
        Can't scan the tag?
      </div>

      <div class="manual-row">

        <input
          id="manualId"
          type="text"
          autocomplete="off"
          autocapitalize="characters"
          placeholder="P-001"
          maxlength="10"
        >

        <button
          class="manual-button"
          type="button"
          onclick="submitManualId()"
        >
          Go
        </button>

      </div>

    </div>

    <div class="bottom-actions">

      <button
        class="retry"
        id="retryButton"
        type="button"
        onclick="startScanner()"
      >
        Try Again
      </button>

      <button
        class="cancel"
        type="button"
        onclick="returnToDashboard()"
      >
        Cancel
      </button>

    </div>

  </div>

  <div class="tip">
    The entire camera image is active. Hold the square Data Matrix steady and allow the camera to focus.
  </div>

</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
const APP_URL=
  'https://logancameron97.github.io/plant-dashboard-images/app.html';

let scanner=null;
let scannerRunning=false;
let startingScanner=false;
let scanComplete=false;

document.addEventListener(
  'DOMContentLoaded',
  ()=>{
    document
      .getElementById(
        'manualId'
      )
      .addEventListener(
        'keydown',
        event=>{
          if(event.key==='Enter'){
            submitManualId();
          }
        }
      );

    setTimeout(
      startScanner,
      250
    );
  }
);


/* ==================================
   START CAMERA
================================== */

async function startScanner(){
  if(
    scannerRunning||
    startingScanner||
    scanComplete
  ){
    return;
  }

  startingScanner=true;

  document.getElementById(
    'retryButton'
  ).style.display='none';

  setStatus(
    'Requesting rear camera…'
  );

  try{
    if(
      typeof Html5Qrcode==='undefined'
    ){
      throw new Error(
        'Scanner library did not load.'
      );
    }

    if(scanner){
      try{
        await scanner.clear();
      }catch(error){}

      scanner=null;
    }

    scanner=
      new Html5Qrcode(
        'reader',
        {
          formatsToSupport:[
            Html5QrcodeSupportedFormats.DATA_MATRIX,
            Html5QrcodeSupportedFormats.QR_CODE
          ],
          verbose:false
        }
      );

    /*
    No qrbox.

    The complete video frame is used
    for detection.
    */
    await scanner.start(
      {
        facingMode:'environment'
      },
      {
        fps:15,
        disableFlip:true
      },
      handleScanSuccess,
      ()=>{}
    );

    scannerRunning=true;
    startingScanner=false;

    setStatus(
      'Camera ready — scan a plant tag.'
    );

  }catch(error){
    console.error(error);

    scannerRunning=false;
    startingScanner=false;

    setStatus(
      'Camera could not start: '+
      getErrorMessage(error),
      'error'
    );

    document.getElementById(
      'retryButton'
    ).style.display='block';
  }
}


/* ==================================
   SUCCESS
================================== */

function handleScanSuccess(
  decodedText
){
  if(scanComplete){
    return;
  }

  const plantId=
    normalizePlantId(
      decodedText
    );

  if(!plantId){
    return;
  }

  finishScan(
    plantId
  );
}


/* ==================================
   MANUAL ENTRY
================================== */

function submitManualId(){
  const plantId=
    normalizePlantId(
      document.getElementById(
        'manualId'
      ).value
    );

  if(!plantId){
    setStatus(
      'Enter a plant ID such as P-001.',
      'error'
    );

    return;
  }

  finishScan(
    plantId
  );
}


/* ==================================
   FINISH

   IMPORTANT:
   No watering/repotting is performed
   here.

   Only the plant ID is returned to the
   dashboard.
================================== */

async function finishScan(
  plantId
){
  if(scanComplete){
    return;
  }

  scanComplete=true;

  setStatus(
    '✓ '+plantId+' scanned',
    'success'
  );

  try{
    if(
      scanner&&
      scannerRunning
    ){
      await scanner.stop();
      scannerRunning=false;
    }

  }catch(error){}

  setTimeout(
    ()=>{
      window.location.replace(
        APP_URL+
        '?scan='+
        encodeURIComponent(
          plantId
        )
      );
    },
    250
  );
}


/* ==================================
   NORMALISE ID
================================== */

function normalizePlantId(value){
  const match=
    String(value||'')
      .trim()
      .toUpperCase()
      .match(
        /\bP-\d{3,}\b/
      );

  return match
    ?match[0]
    :'';
}


/* ==================================
   CANCEL
================================== */

async function returnToDashboard(){
  try{
    if(
      scanner&&
      scannerRunning
    ){
      await scanner.stop();
    }
  }catch(error){}

  window.location.replace(
    APP_URL
  );
}


/* ==================================
   HELPERS
================================== */

function setStatus(
  message,
  type=''
){
  const status=
    document.getElementById(
      'status'
    );

  status.textContent=
    message;

  status.className=
    'status'+
    (
      type
        ?' '+type
        :''
    );
}

function getErrorMessage(error){
  if(!error){
    return 'Unknown camera error.';
  }

  if(typeof error==='string'){
    return error;
  }

  return (
    error.message||
    error.name||
    String(error)
  );
}
</script>

</body>
</html>
