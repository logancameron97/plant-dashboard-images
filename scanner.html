<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<title>Scan Plant</title>

<style>
:root{
  --bg:#eef5f0;
  --card:#fff;
  --text:#294136;
  --muted:#74877d;
  --border:#dbe7df;
  --green:#6fa982;
  --green-soft:#e9f5ed;
  --soft:#f6faf7;
  --red:#a35858;
  --red-soft:#faeeee;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}

html,
body{
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
}

body{
  min-height:100dvh;
  padding:
    max(16px,env(safe-area-inset-top))
    16px
    max(18px,env(safe-area-inset-bottom));
}

.wrapper{
  width:100%;
  max-width:520px;
  margin:auto;
}

.header{
  margin-bottom:15px;
  text-align:center;
}

.icon{
  font-size:1.9rem;
}

h1{
  font-size:1.4rem;
}

.subtitle{
  margin-top:5px;
  color:var(--muted);
  font-size:.83rem;
}

.scanner-card{
  padding:11px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  box-shadow:0 10px 30px rgba(50,75,62,.1);
}

/* CAMERA */

.camera-wrap{
  position:relative;
  width:100%;
  overflow:hidden;
  background:#000;
  border-radius:15px;
}

#video{
  display:block;
  width:100%;
  height:auto;
  background:#000;
  object-fit:cover;
}

/* Visual guide only.
   ZXing still scans the full frame. */

.guide{
  position:absolute;
  left:50%;
  top:50%;
  width:68%;
  aspect-ratio:1/1;
  transform:translate(-50%,-50%);
  pointer-events:none;
  border:2px solid rgba(255,255,255,.92);
  border-radius:16px;
  box-shadow:0 0 0 9999px rgba(0,0,0,.10);
}

/* STATUS */

.status{
  min-height:42px;
  margin-top:11px;
  padding:10px;
  background:var(--soft);
  border-radius:10px;
  color:var(--muted);
  font-size:.8rem;
  line-height:1.35;
  text-align:center;
}

.status.success{
  background:var(--green-soft);
  color:#4f8f63;
  font-weight:700;
}

.status.error{
  background:var(--red-soft);
  color:var(--red);
}

/* MANUAL FALLBACK */

.manual{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid var(--border);
}

.manual-label{
  margin-bottom:6px;
  color:var(--muted);
  font-size:.75rem;
  font-weight:700;
}

.manual-row{
  display:flex;
  gap:7px;
}

.manual-row input{
  flex:1;
  min-width:0;
  padding:11px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--soft);
  color:var(--text);
  font-size:1rem;
  text-transform:uppercase;
}

button{
  border:0;
  cursor:pointer;
}

.manual-button{
  padding:0 16px;
  border-radius:10px;
  background:var(--green);
  color:#fff;
  font-weight:700;
}

/* BUTTONS */

.bottom-actions{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.bottom-actions button{
  flex:1;
  padding:11px;
  border-radius:10px;
  font-size:.82rem;
  font-weight:700;
}

.retry{
  display:none;
  background:var(--green);
  color:#fff;
}

.cancel{
  background:#dfe8e2;
  color:var(--text);
}

.tip{
  margin-top:12px;
  color:var(--muted);
  font-size:.72rem;
  line-height:1.4;
  text-align:center;
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="header">
    <div class="icon">🌿</div>

    <h1>Scan Plant</h1>

    <div class="subtitle">
      Point the camera at the square Data Matrix.
    </div>
  </div>

  <div class="scanner-card">

    <div class="camera-wrap">

      <video
        id="video"
        playsinline
        muted
        autoplay
      ></video>

      <div class="guide"></div>

    </div>

    <div
      class="status"
      id="status"
    >
      Starting camera…
    </div>

    <div class="manual">

      <div class="manual-label">
        Can't scan the tag?
      </div>

      <div class="manual-row">

        <input
          id="manualId"
          type="text"
          autocomplete="off"
          autocapitalize="characters"
          placeholder="P-001"
          maxlength="10"
        >

        <button
          class="manual-button"
          type="button"
          onclick="submitManualId()"
        >
          Go
        </button>

      </div>

    </div>

    <div class="bottom-actions">

      <button
        class="retry"
        id="retryButton"
        type="button"
        onclick="startScanner()"
      >
        Try Again
      </button>

      <button
        class="cancel"
        type="button"
        onclick="returnToDashboard()"
      >
        Cancel
      </button>

    </div>

  </div>

  <div class="tip">
    You do not need to perfectly fill the square.
    Hold the tag steady and give the camera a moment to focus.
  </div>

</div>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

<script>
const APP_URL=
  'https://logancameron97.github.io/plant-dashboard-images/app.html';

let codeReader=null;
let scanComplete=false;
let startingScanner=false;

document.addEventListener(
  'DOMContentLoaded',
  ()=>{
    document
      .getElementById('manualId')
      .addEventListener(
        'keydown',
        event=>{
          if(event.key==='Enter'){
            submitManualId();
          }
        }
      );

    setTimeout(
      startScanner,
      300
    );
  }
);


/* =====================================
   START SCANNER
===================================== */

async function startScanner(){
  if(
    startingScanner||
    scanComplete
  ){
    return;
  }

  startingScanner=true;

  document.getElementById(
    'retryButton'
  ).style.display='none';

  setStatus(
    'Requesting rear camera…'
  );

  try{
    stopScanner();

    if(
      typeof ZXing==='undefined'
    ){
      throw new Error(
        'ZXing scanner library did not load.'
      );
    }

    const hints=
      new Map();

    /*
    Only look for Data Matrix.
    */
    hints.set(
      ZXing.DecodeHintType.POSSIBLE_FORMATS,
      [
        ZXing.BarcodeFormat.DATA_MATRIX
      ]
    );

    /*
    Spend more effort trying to decode
    small / difficult labels.
    */
    hints.set(
      ZXing.DecodeHintType.TRY_HARDER,
      true
    );

    codeReader=
      new ZXing.BrowserMultiFormatReader(
        hints,
        50
      );

    /*
    Passing undefined avoids the
    listVideoInputDevices error.

    ZXing/browser will request the camera
    directly.
    */
    await codeReader.decodeFromVideoDevice(
      undefined,
      'video',
      (result,error)=>{
        if(scanComplete){
          return;
        }

        if(result){
          const text=
            typeof result.getText==='function'
              ?result.getText()
              :String(result.text||'');

          const plantId=
            normalizePlantId(
              text
            );

          if(plantId){
            finishScan(
              plantId
            );
          }
        }
      }
    );

    startingScanner=false;

    setStatus(
      'Camera ready — scan a plant tag.'
    );

  }catch(error){
    console.error(error);

    startingScanner=false;

    stopScanner();

    setStatus(
      'Camera could not start: '+
      getErrorMessage(error),
      'error'
    );

    document.getElementById(
      'retryButton'
    ).style.display='block';
  }
}


/* =====================================
   MANUAL ENTRY
===================================== */

function submitManualId(){
  const value=
    document.getElementById(
      'manualId'
    ).value;

  const plantId=
    normalizePlantId(
      value
    );

  if(!plantId){
    setStatus(
      'Enter a plant ID such as P-001.',
      'error'
    );

    return;
  }

  finishScan(
    plantId
  );
}


/* =====================================
   SUCCESS

   Only sends the ID to the app.

   Water / Repot / Both happens
   afterwards on the dashboard.
===================================== */

function finishScan(
  plantId
){
  if(scanComplete){
    return;
  }

  scanComplete=true;

  setStatus(
    '✓ '+plantId+' scanned',
    'success'
  );

  stopScanner();

  setTimeout(
    ()=>{
      window.location.replace(
        APP_URL+
        '?scan='+
        encodeURIComponent(
          plantId
        )
      );
    },
    250
  );
}


/* =====================================
   PLANT ID
===================================== */

function normalizePlantId(
  value
){
  const match=
    String(value||'')
      .trim()
      .toUpperCase()
      .match(
        /\bP-\d{3,}\b/
      );

  return match
    ?match[0]
    :'';
}


/* =====================================
   STOP CAMERA
===================================== */

function stopScanner(){
  try{
    if(codeReader){
      codeReader.reset();
    }
  }catch(error){}

  codeReader=null;

  const video=
    document.getElementById(
      'video'
    );

  if(
    video&&
    video.srcObject
  ){
    try{
      video.srcObject
        .getTracks()
        .forEach(
          track=>track.stop()
        );
    }catch(error){}

    video.srcObject=null;
  }
}


/* =====================================
   CANCEL
===================================== */

function returnToDashboard(){
  stopScanner();

  window.location.replace(
    APP_URL
  );
}


/* =====================================
   HELPERS
===================================== */

function setStatus(
  message,
  type=''
){
  const status=
    document.getElementById(
      'status'
    );

  status.textContent=
    message;

  status.className=
    'status'+
    (
      type
        ?' '+type
        :''
    );
}


function getErrorMessage(
  error
){
  if(!error){
    return 'Unknown camera error.';
  }

  if(typeof error==='string'){
    return error;
  }

  return (
    error.message||
    error.name||
    String(error)
  );
}


/* Stop camera if Safari navigates away */

window.addEventListener(
  'pagehide',
  stopScanner
);
</script>

</body>
</html>
