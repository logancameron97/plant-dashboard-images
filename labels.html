<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>Plant Labels</title>

<style>
:root{
  --bg:#eef5f0;
  --card:#fff;
  --text:#294136;
  --muted:#74877d;
  --border:#dbe7df;
  --green:#6fa982;
  --green-soft:#e9f5ed;
  --blue:#79a9cf;
  --soft:#f6faf7;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:18px;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}

.controls{
  width:100%;
  max-width:700px;
  margin:0 auto 22px;
  padding:18px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:0 8px 24px rgba(50,75,62,.08);
}

h1{
  margin:0 0 5px;
  font-size:1.4rem;
}

.description{
  margin-bottom:18px;
  color:var(--muted);
  font-size:.83rem;
  line-height:1.45;
}

.section{
  margin-top:17px;
  padding-top:16px;
  border-top:1px solid var(--border);
}

.section:first-of-type{
  margin-top:0;
  padding-top:0;
  border-top:0;
}

.section-title{
  margin-bottom:8px;
  font-size:.8rem;
  font-weight:750;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.count{
  color:var(--muted);
  font-weight:500;
}

.empty{
  padding:10px 12px;
  background:var(--soft);
  color:var(--muted);
  border-radius:10px;
  font-size:.8rem;
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.chip{
  padding:6px 9px;
  background:var(--green-soft);
  color:#4f7860;
  border-radius:9px;
  font-size:.76rem;
  font-weight:700;
}

.remake-chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:#e8f0f7;
  color:#55758f;
}

.remove{
  border:0;
  padding:0;
  background:transparent;
  color:inherit;
  font-size:.95rem;
  line-height:1;
  cursor:pointer;
}

.old-row{
  display:flex;
  gap:8px;
}

select{
  flex:1;
  min-width:0;
  padding:10px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--soft);
  color:var(--text);
  font-size:.9rem;
}

button{
  border:0;
  cursor:pointer;
  touch-action:manipulation;
}

.add-old{
  padding:10px 13px;
  border-radius:9px;
  background:var(--blue);
  color:#fff;
  font-weight:700;
}

.settings{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.setting label{
  display:block;
  margin-bottom:4px;
  color:var(--muted);
  font-size:.69rem;
}

.setting input{
  width:100%;
  padding:8px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#fff;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:17px;
}

.buttons button{
  padding:11px;
  border-radius:10px;
  font-size:.82rem;
  font-weight:700;
}

.generate{
  background:#7eb6a2;
  color:#fff;
}

.print{
  background:var(--green);
  color:#fff;
}

.done{
  background:#5f8e75;
  color:#fff;
}

.back{
  background:#dfe8e2;
  color:var(--text);
}

.message{
  display:none;
  margin-top:12px;
  padding:10px;
  border-radius:10px;
  background:var(--green-soft);
  color:#4f7860;
  font-size:.8rem;
  text-align:center;
}

.preview-title{
  max-width:700px;
  margin:0 auto 10px;
  color:var(--muted);
  font-size:.78rem;
  font-weight:700;
  text-align:center;
}

/*
14mm wide x 40mm tall
*/

#labels{
  display:grid;
  grid-template-columns:repeat(auto-fill,14mm);
  justify-content:center;
  gap:2mm;
}

.label{
  width:14mm;
  height:40mm;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:.8mm .7mm .7mm;
  overflow:hidden;
  background:#fff;
  color:#000;
  outline:1px solid #ddd;
}

.matrix-area{
  width:12.4mm;
  height:32.5mm;
  flex:0 0 32.5mm;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.matrix-area canvas{
  display:block;
  image-rendering:pixelated;
}

.label-id{
  width:100%;
  height:5.5mm;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#000;
  font-family:Arial,sans-serif;
  font-size:8pt;
  font-weight:800;
  line-height:1;
  letter-spacing:.1mm;
  white-space:nowrap;
  text-align:center;
}

@media print{
  @page{
    margin:4mm;
  }

  body{
    margin:0;
    padding:0;
    background:#fff;
  }

  .controls,
  .preview-title{
    display:none!important;
  }

  #labels{
    grid-template-columns:repeat(auto-fill,14mm);
    justify-content:start;
    gap:1mm;
  }

  .label{
    outline:none;
    break-inside:avoid;
    page-break-inside:avoid;
  }
}

@media(max-width:600px){
  .settings{
    grid-template-columns:1fr;
  }

  .buttons{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="controls">

  <h1>🏷️ Plant Labels</h1>

  <div class="description">
    Plants without a recorded label are included automatically.
    To replace an existing label, select that plant below before generating.
  </div>

  <div class="section">

    <div class="section-title">
      New labels
      <span
        class="count"
        id="newCount"
      ></span>
    </div>

    <div id="newPlants"></div>

  </div>

  <div class="section">

    <div class="section-title">
      Remake an existing label
    </div>

    <div class="old-row">

      <select id="oldPlantSelect">
        <option value="">
          Select old plant…
        </option>
      </select>

      <button
        class="add-old"
        type="button"
        onclick="addOldPlant()"
      >
        Add
      </button>

    </div>

    <div
      class="chips"
      id="remakePlants"
      style="margin-top:9px"
    ></div>

  </div>

  <div class="section">

    <div class="section-title">
      Physical dimensions
    </div>

    <div class="settings">

      <div class="setting">
        <label>Tag width (mm)</label>

        <input
          id="labelWidth"
          type="number"
          value="14"
          min="10"
          step=".5"
        >
      </div>

      <div class="setting">
        <label>Tag height (mm)</label>

        <input
          id="labelHeight"
          type="number"
          value="40"
          min="20"
          step=".5"
        >
      </div>

      <div class="setting">
        <label>Matrix max height (mm)</label>

        <input
          id="matrixHeight"
          type="number"
          value="30"
          min="15"
          max="33"
          step=".5"
        >
      </div>

    </div>

  </div>

  <div class="buttons">

    <button
      class="generate"
      type="button"
      onclick="generateLabels()"
    >
      Generate Labels
    </button>

    <button
      class="print"
      type="button"
      onclick="printLabels()"
    >
      Print
    </button>

    <button
      class="done"
      type="button"
      onclick="saveAndReturn()"
    >
      Save as Generated & Return
    </button>

    <button
      class="back"
      type="button"
      onclick="returnWithoutSaving()"
    >
      Back Without Saving
    </button>

  </div>

  <div
    class="message"
    id="message"
  ></div>

</div>

<div
  class="preview-title"
  id="previewTitle"
  style="display:none"
>
  Label preview — print at 100% / Actual Size
</div>

<div id="labels"></div>

<script src="https://unpkg.com/bwip-js/dist/bwip-js-min.js"></script>

<script>
const APP_URL=
  'https://logancameron97.github.io/plant-dashboard-images/app.html';

let newIds=[];
let oldIds=[];
let remakeIds=[];
let lastGeneratedIds=[];

document.addEventListener(
  'DOMContentLoaded',
  initLabels
);

function initLabels(){
  const params=
    new URLSearchParams(
      window.location.search
    );

  newIds=
    parseIds(
      params.get('new')
    );

  oldIds=
    parseIds(
      params.get('old')
    );

  /*
  Don't allow the same plant to appear in both sets.
  */
  oldIds=
    oldIds.filter(
      id=>!newIds.includes(id)
    );

  renderNewPlants();
  renderOldSelect();
  renderRemakes();
}

function parseIds(value){
  const matches=
    String(value||'')
      .toUpperCase()
      .match(/P-\d{3,}/g)||
      [];

  return [
    ...new Set(matches)
  ];
}

function renderNewPlants(){
  const container=
    document.getElementById(
      'newPlants'
    );

  const count=
    document.getElementById(
      'newCount'
    );

  count.textContent=
    '('+newIds.length+')';

  if(!newIds.length){
    container.innerHTML=
      '<div class="empty">'+
      'All current plants already have a generated label.'+
      '</div>';

    return;
  }

  container.innerHTML=
    '<div class="chips">'+
      newIds
        .map(
          id=>
            '<span class="chip">'+
            id+
            '</span>'
        )
        .join('')+
    '</div>';
}

function renderOldSelect(){
  const select=
    document.getElementById(
      'oldPlantSelect'
    );

  const available=
    oldIds.filter(
      id=>!remakeIds.includes(id)
    );

  select.innerHTML=
    '<option value="">'+
    'Select old plant…'+
    '</option>'+
    available
      .map(
        id=>
          '<option value="'+id+'">'+
          id+
          '</option>'
      )
      .join('');
}

function addOldPlant(){
  const select=
    document.getElementById(
      'oldPlantSelect'
    );

  const id=
    select.value;

  if(!id)return;

  if(!remakeIds.includes(id)){
    remakeIds.push(id);
  }

  renderRemakes();
  renderOldSelect();

  /*
  If labels were already generated,
  force regeneration so the new selection is included.
  */
  lastGeneratedIds=[];

  document.getElementById(
    'labels'
  ).innerHTML='';

  document.getElementById(
    'previewTitle'
  ).style.display='none';
}

function removeRemake(id){
  remakeIds=
    remakeIds.filter(
      item=>item!==id
    );

  renderRemakes();
  renderOldSelect();

  lastGeneratedIds=[];

  document.getElementById(
    'labels'
  ).innerHTML='';

  document.getElementById(
    'previewTitle'
  ).style.display='none';
}

function renderRemakes(){
  const container=
    document.getElementById(
      'remakePlants'
    );

  if(!remakeIds.length){
    container.innerHTML='';
    return;
  }

  container.innerHTML=
    remakeIds
      .map(
        id=>
          '<span class="chip remake-chip">'+
          id+
          '<button '+
          'class="remove" '+
          'type="button" '+
          'aria-label="Remove '+id+'" '+
          'onclick="removeRemake(\''+
          id+
          '\')">'+
          '×'+
          '</button>'+
          '</span>'
      )
      .join('');
}

function getSelectedIds(){
  return [
    ...new Set(
      [
        ...newIds,
        ...remakeIds
      ]
    )
  ];
}

function generateLabels(){
  if(typeof bwipjs==='undefined'){
    alert(
      'Data Matrix generator failed to load.'
    );

    return;
  }

  const ids=
    getSelectedIds();

  if(!ids.length){
    alert(
      'There are no new labels. Add an existing plant above if you want to remake one.'
    );

    return;
  }

  const labelWidth=
    Number(
      document.getElementById(
        'labelWidth'
      ).value
    )||14;

  const labelHeight=
    Number(
      document.getElementById(
        'labelHeight'
      ).value
    )||40;

  const maxMatrixHeight=
    Number(
      document.getElementById(
        'matrixHeight'
      ).value
    )||30;

  /*
  Leave approximately 1mm white space
  on the left and right.
  */
  const maxMatrixWidth=
    Math.max(
      6,
      labelWidth-2
    );

  const container=
    document.getElementById(
      'labels'
    );

  container.innerHTML='';

  container.style.gridTemplateColumns=
    'repeat(auto-fill,'+
    labelWidth+
    'mm)';

  let generatedCount=0;

  ids.forEach(id=>{
    const label=
      document.createElement(
        'div'
      );

    label.className='label';

    label.style.width=
      labelWidth+'mm';

    label.style.height=
      labelHeight+'mm';

    const matrixArea=
      document.createElement(
        'div'
      );

    matrixArea.className=
      'matrix-area';

    /*
    Reserve roughly 6.5mm at the bottom
    for the readable plant ID.
    */
    matrixArea.style.height=
      Math.max(
        10,
        labelHeight-7.5
      )+'mm';

    matrixArea.style.flexBasis=
      Math.max(
        10,
        labelHeight-7.5
      )+'mm';

    const rawCanvas=
      document.createElement(
        'canvas'
      );

    try{
      bwipjs.toCanvas(
        rawCanvas,
        {
          bcid:'datamatrixrectangular',
          text:id,
          scale:12,
          padding:2
        }
      );

    }catch(error){
      console.error(
        'Could not generate '+id,
        error
      );

      return;
    }

    const verticalCanvas=
      makeVerticalCanvas(
        rawCanvas
      );

    sizeMatrixCanvas(
      verticalCanvas,
      maxMatrixWidth,
      maxMatrixHeight
    );

    matrixArea.appendChild(
      verticalCanvas
    );

    const idText=
      document.createElement(
        'div'
      );

    idText.className=
      'label-id';

    idText.textContent=
      id;

    label.appendChild(
      matrixArea
    );

    label.appendChild(
      idText
    );

    container.appendChild(
      label
    );

    generatedCount++;
  });

  if(!generatedCount){
    alert(
      'No labels could be generated.'
    );

    return;
  }

  lastGeneratedIds=[
    ...ids
  ];

  document.getElementById(
    'previewTitle'
  ).style.display='block';

  showMessage(
    generatedCount+
    (
      generatedCount===1
        ?' label generated.'
        :' labels generated.'
    )+
    ' Print at 100% / Actual Size.'
  );
}

function makeVerticalCanvas(source){
  /*
  If bwip-js already created a vertical
  symbol, leave it alone.
  */
  if(source.height>=source.width){
    return source;
  }

  const output=
    document.createElement(
      'canvas'
    );

  output.width=
    source.height;

  output.height=
    source.width;

  const ctx=
    output.getContext(
      '2d'
    );

  /*
  Disable interpolation so the Data Matrix
  modules stay sharp.
  */
  ctx.imageSmoothingEnabled=false;

  ctx.translate(
    output.width/2,
    output.height/2
  );

  ctx.rotate(
    Math.PI/2
  );

  ctx.drawImage(
    source,
    -source.width/2,
    -source.height/2
  );

  return output;
}

function sizeMatrixCanvas(
  canvas,
  maxWidthMm,
  maxHeightMm
){
  /*
  Preserve the exact barcode aspect ratio.
  Never stretch the Data Matrix.
  */
  const ratio=
    canvas.width/
    canvas.height;

  let heightMm=
    maxHeightMm;

  let widthMm=
    heightMm*ratio;

  if(widthMm>maxWidthMm){
    widthMm=
      maxWidthMm;

    heightMm=
      widthMm/ratio;
  }

  canvas.style.width=
    widthMm+'mm';

  canvas.style.height=
    heightMm+'mm';
}

function printLabels(){
  if(!lastGeneratedIds.length){
    generateLabels();

    if(!lastGeneratedIds.length){
      return;
    }
  }

  window.print();
}

function saveAndReturn(){
  if(!lastGeneratedIds.length){
    alert(
      'Generate the labels first.'
    );

    return;
  }

  const url=
    APP_URL+
    '?labelsGenerated='+
    encodeURIComponent(
      lastGeneratedIds.join(',')
    );

  window.location.replace(
    url
  );
}

function returnWithoutSaving(){
  window.location.replace(
    APP_URL
  );
}

function showMessage(message){
  const el=
    document.getElementById(
      'message'
    );

  el.textContent=
    message;

  el.style.display=
    'block';
}
</script>

</body>
</html>
