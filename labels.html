<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>Plant Labels</title>

<style>
:root{
  --bg:#eef5f0;
  --card:#fff;
  --text:#294136;
  --muted:#74877d;
  --border:#dbe7df;
  --green:#6fa982;
  --green-soft:#e9f5ed;
  --blue:#79a9cf;
  --purple:#879fd0;
  --soft:#f6faf7;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:18px;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}

.controls{
  width:100%;
  max-width:700px;
  margin:0 auto 22px;
  padding:18px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:0 8px 24px rgba(50,75,62,.08);
}

h1{
  margin:0 0 5px;
  font-size:1.4rem;
}

.description{
  margin-bottom:18px;
  color:var(--muted);
  font-size:.83rem;
  line-height:1.45;
}

.section{
  margin-top:17px;
  padding-top:16px;
  border-top:1px solid var(--border);
}

.section:first-of-type{
  margin-top:0;
  padding-top:0;
  border-top:0;
}

.section-title{
  margin-bottom:8px;
  font-size:.8rem;
  font-weight:750;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.count{
  color:var(--muted);
  font-weight:500;
}

.empty{
  padding:10px 12px;
  background:var(--soft);
  color:var(--muted);
  border-radius:10px;
  font-size:.8rem;
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.chip{
  padding:6px 9px;
  background:var(--green-soft);
  color:#4f7860;
  border-radius:9px;
  font-size:.76rem;
  font-weight:700;
}

.remake-chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:#e8f0f7;
  color:#55758f;
}

.remove{
  border:0;
  padding:0;
  background:transparent;
  color:inherit;
  font-size:.95rem;
  cursor:pointer;
}

.old-row{
  display:flex;
  gap:8px;
}

select{
  flex:1;
  min-width:0;
  padding:10px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--soft);
  color:var(--text);
  font-size:.9rem;
}

button{
  border:0;
  cursor:pointer;
  touch-action:manipulation;
}

.add-old{
  padding:10px 13px;
  border-radius:9px;
  background:var(--blue);
  color:#fff;
  font-weight:700;
}

.settings{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.setting label{
  display:block;
  margin-bottom:4px;
  color:var(--muted);
  font-size:.69rem;
}

.setting input{
  width:100%;
  padding:8px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#fff;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:17px;
}

.buttons button{
  padding:11px;
  border-radius:10px;
  font-size:.82rem;
  font-weight:700;
}

.generate{
  background:#7eb6a2;
  color:#fff;
}

.print{
  background:var(--green);
  color:#fff;
}

.download{
  background:var(--purple);
  color:#fff;
}

.done{
  background:#5f8e75;
  color:#fff;
}

.back{
  background:#dfe8e2;
  color:var(--text);
}

.message{
  display:none;
  margin-top:12px;
  padding:10px;
  border-radius:10px;
  background:var(--green-soft);
  color:#4f7860;
  font-size:.8rem;
  text-align:center;
}

.preview-title{
  max-width:700px;
  margin:0 auto 10px;
  color:var(--muted);
  font-size:.78rem;
  font-weight:700;
  text-align:center;
}


/* ======================================
   PHYSICAL TAG
====================================== */

#labels{
  display:grid;
  grid-template-columns:repeat(auto-fill,14mm);
  justify-content:center;
  gap:2mm;
}

.label{
  width:14mm;
  height:40mm;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:.7mm;
  overflow:hidden;
  background:#fff;
  color:#000;
  outline:1px solid #ddd;
}


/* ======================================
   QR CODE
====================================== */

.matrix-area{
  width:12.6mm;
  height:13.5mm;
  flex:0 0 13.5mm;
  display:flex;
  align-items:center;
  justify-content:center;
}

.matrix-area canvas{
  display:block;
  image-rendering:pixelated;
}


/* ======================================
   PLANT ID
====================================== */

.label-id{
  width:100%;
  height:5mm;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#000;
  font-family:Arial,sans-serif;
  font-size:8pt;
  font-weight:800;
  line-height:1;
  white-space:nowrap;
}

.label-spacer{
  flex:1;
}


/* ======================================
   PRINT
====================================== */

@media print{
  @page{
    margin:4mm;
  }

  body{
    margin:0;
    padding:0;
    background:#fff;
  }

  .controls,
  .preview-title{
    display:none!important;
  }

  #labels{
    grid-template-columns:repeat(auto-fill,14mm);
    justify-content:start;
    gap:1mm;
  }

  .label{
    outline:none;
    break-inside:avoid;
    page-break-inside:avoid;
  }
}

@media(max-width:600px){
  .settings,
  .buttons{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="controls">

  <h1>🏷️ Plant Labels</h1>

  <div class="description">
    New plants are included automatically. Existing labels can also be selected if you need a replacement.
  </div>

  <div class="section">

    <div class="section-title">
      New labels
      <span
        class="count"
        id="newCount"
      ></span>
    </div>

    <div id="newPlants"></div>

  </div>

  <div class="section">

    <div class="section-title">
      Remake existing label
    </div>

    <div class="old-row">

      <select id="oldPlantSelect">
        <option value="">
          Select old plant…
        </option>
      </select>

      <button
        class="add-old"
        type="button"
        onclick="addOldPlant()"
      >
        Add
      </button>

    </div>

    <div
      class="chips"
      id="remakePlants"
      style="margin-top:9px"
    ></div>

  </div>

  <div class="section">

    <div class="section-title">
      Label dimensions
    </div>

    <div class="settings">

      <div class="setting">
        <label>Tag width (mm)</label>

        <input
          id="labelWidth"
          type="number"
          value="14"
          min="10"
          step=".5"
        >
      </div>

      <div class="setting">
        <label>Tag height (mm)</label>

        <input
          id="labelHeight"
          type="number"
          value="40"
          min="20"
          step=".5"
        >
      </div>

      <div class="setting">
        <label>QR size (mm)</label>

        <input
          id="matrixSize"
          type="number"
          value="12"
          min="9"
          max="12"
          step=".5"
        >
      </div>

    </div>

  </div>

  <div class="buttons">

    <button
      class="generate"
      onclick="generateLabels()"
    >
      Generate Labels
    </button>

    <button
      class="print"
      onclick="printLabels()"
    >
      Print
    </button>

    <button
      class="download"
      onclick="downloadLabelPngs()"
    >
      ⬇️ Save PNGs
    </button>

    <button
      class="done"
      onclick="saveAndReturn()"
    >
      Save as Generated & Return
    </button>

    <button
      class="back"
      onclick="returnWithoutSaving()"
    >
      Back Without Saving
    </button>

  </div>

  <div
    class="message"
    id="message"
  ></div>

</div>

<div
  class="preview-title"
  id="previewTitle"
  style="display:none"
>
  QR label preview
</div>

<div id="labels"></div>

<script src="https://unpkg.com/bwip-js/dist/bwip-js-min.js"></script>

<script>
const APP_URL=
  'https://logancameron97.github.io/plant-dashboard-images/app.html';

const PRINTER_DPI=203;

let newIds=[];
let oldIds=[];
let remakeIds=[];
let lastGeneratedIds=[];

document.addEventListener(
  'DOMContentLoaded',
  initLabels
);

function initLabels(){
  const params=
    new URLSearchParams(
      window.location.search
    );

  newIds=
    parseIds(
      params.get('new')
    );

  oldIds=
    parseIds(
      params.get('old')
    );

  oldIds=
    oldIds.filter(
      id=>!newIds.includes(id)
    );

  renderNewPlants();
  renderOldSelect();
  renderRemakes();
}

function parseIds(value){
  return [
    ...new Set(
      String(value||'')
        .toUpperCase()
        .match(/P-\d{3,}/g)||
        []
    )
  ];
}

function renderNewPlants(){
  const container=
    document.getElementById(
      'newPlants'
    );

  document.getElementById(
    'newCount'
  ).textContent=
    '('+newIds.length+')';

  if(!newIds.length){
    container.innerHTML=
      '<div class="empty">'+
      'All current plants already have a generated label.'+
      '</div>';

    return;
  }

  container.innerHTML=
    '<div class="chips">'+
    newIds.map(
      id=>
        '<span class="chip">'+
        id+
        '</span>'
    ).join('')+
    '</div>';
}

function renderOldSelect(){
  const select=
    document.getElementById(
      'oldPlantSelect'
    );

  const available=
    oldIds.filter(
      id=>!remakeIds.includes(id)
    );

  select.innerHTML=
    '<option value="">Select old plant…</option>'+
    available.map(
      id=>
        '<option value="'+id+'">'+
        id+
        '</option>'
    ).join('');
}

function addOldPlant(){
  const id=
    document.getElementById(
      'oldPlantSelect'
    ).value;

  if(!id)return;

  if(!remakeIds.includes(id)){
    remakeIds.push(id);
  }

  renderRemakes();
  renderOldSelect();
  clearGeneratedPreview();
}

function removeRemake(id){
  remakeIds=
    remakeIds.filter(
      item=>item!==id
    );

  renderRemakes();
  renderOldSelect();
  clearGeneratedPreview();
}

function renderRemakes(){
  const container=
    document.getElementById(
      'remakePlants'
    );

  container.innerHTML=
    remakeIds.map(
      id=>
        '<span class="chip remake-chip">'+
        id+
        '<button class="remove" '+
        'onclick="removeRemake(\''+id+'\')">'+
        '×'+
        '</button>'+
        '</span>'
    ).join('');
}

function clearGeneratedPreview(){
  lastGeneratedIds=[];

  document.getElementById(
    'labels'
  ).innerHTML='';

  document.getElementById(
    'previewTitle'
  ).style.display='none';

  document.getElementById(
    'message'
  ).style.display='none';
}

function getSelectedIds(){
  return [
    ...new Set(
      [
        ...newIds,
        ...remakeIds
      ]
    )
  ];
}


/* ======================================
   GENERATE QR LABELS
====================================== */

function generateLabels(){
  if(typeof bwipjs==='undefined'){
    alert(
      'QR generator failed to load.'
    );

    return;
  }

  const ids=
    getSelectedIds();

  if(!ids.length){
    alert(
      'There are no labels to generate.'
    );

    return;
  }

  const labelWidth=
    Number(
      document.getElementById(
        'labelWidth'
      ).value
    )||14;

  const labelHeight=
    Number(
      document.getElementById(
        'labelHeight'
      ).value
    )||40;

  const qrSize=
    Math.min(
      Number(
        document.getElementById(
          'matrixSize'
        ).value
      )||12,
      labelWidth-2
    );

  const container=
    document.getElementById(
      'labels'
    );

  container.innerHTML='';

  container.style.gridTemplateColumns=
    'repeat(auto-fill,'+
    labelWidth+
    'mm)';

  const generated=[];

  ids.forEach(id=>{

    const label=
      document.createElement(
        'div'
      );

    label.className='label';
    label.dataset.plantId=id;

    label.style.width=
      labelWidth+'mm';

    label.style.height=
      labelHeight+'mm';

    const matrixArea=
      document.createElement(
        'div'
      );

    matrixArea.className=
      'matrix-area';

    const canvas=
      document.createElement(
        'canvas'
      );

    try{
      bwipjs.toCanvas(
        canvas,
        {
          bcid:'qrcode',
          text:id,

          /*
          Lowest practical QR error correction
          keeps P-001 extremely simple and gives
          us larger modules.
          */
          eclevel:'L',

          /*
          High quality source.
          */
          scale:20,

          /*
          QR quiet zone.
          */
          padding:4,

          backgroundcolor:'FFFFFF'
        }
      );

    }catch(error){
      console.error(
        id,
        error
      );

      return;
    }

    canvas.style.width=
      qrSize+'mm';

    canvas.style.height=
      qrSize+'mm';

    matrixArea.appendChild(
      canvas
    );

    const text=
      document.createElement(
        'div'
      );

    text.className='label-id';
    text.textContent=id;

    const spacer=
      document.createElement(
        'div'
      );

    spacer.className=
      'label-spacer';

    label.appendChild(
      matrixArea
    );

    label.appendChild(
      text
    );

    label.appendChild(
      spacer
    );

    container.appendChild(
      label
    );

    generated.push(id);
  });

  lastGeneratedIds=
    generated;

  document.getElementById(
    'previewTitle'
  ).style.display=
    generated.length
      ?'block'
      :'none';

  showMessage(
    generated.length+
    (
      generated.length===1
        ?' label generated.'
        :' labels generated.'
    )
  );
}


/* ======================================
   PRINT
====================================== */

function printLabels(){
  if(!lastGeneratedIds.length){
    generateLabels();

    if(!lastGeneratedIds.length){
      return;
    }
  }

  window.print();
}


/* ======================================
   SAVE PNGS
====================================== */

async function downloadLabelPngs(){
  if(!lastGeneratedIds.length){
    generateLabels();

    if(!lastGeneratedIds.length){
      return;
    }
  }

  const labels=[
    ...document.querySelectorAll(
      '#labels .label'
    )
  ];

  showMessage(
    'Creating PNG files…'
  );

  let count=0;

  for(const label of labels){
    const file=
      await buildLabelPng(
        label
      );

    downloadBlob(
      file.blob,
      file.plantId+'.png'
    );

    count++;

    await delay(250);
  }

  showMessage(
    count+
    (
      count===1
        ?' PNG saved.'
        :' PNGs saved.'
    )
  );
}

function buildLabelPng(label){
  return new Promise(
    (resolve,reject)=>{

      const plantId=
        label.dataset.plantId;

      const source=
        label.querySelector(
          '.matrix-area canvas'
        );

      if(!plantId||!source){
        reject(
          new Error(
            'Label could not be read.'
          )
        );

        return;
      }

      const widthMm=
        Number(
          document.getElementById(
            'labelWidth'
          ).value
        )||14;

      const heightMm=
        Number(
          document.getElementById(
            'labelHeight'
          ).value
        )||40;

      const qrMm=
        Math.min(
          Number(
            document.getElementById(
              'matrixSize'
            ).value
          )||12,
          widthMm-2
        );

      const pxPerMm=
        PRINTER_DPI/25.4;

      const widthPx=
        Math.round(
          widthMm*
          pxPerMm
        );

      const heightPx=
        Math.round(
          heightMm*
          pxPerMm
        );

      const output=
        document.createElement(
          'canvas'
        );

      output.width=
        widthPx;

      output.height=
        heightPx;

      const ctx=
        output.getContext(
          '2d'
        );

      ctx.imageSmoothingEnabled=
        false;

      ctx.fillStyle='#fff';

      ctx.fillRect(
        0,
        0,
        widthPx,
        heightPx
      );

      const qrPx=
        Math.round(
          qrMm*
          pxPerMm
        );

      const x=
        Math.round(
          (
            widthPx-
            qrPx
          )/2
        );

      const y=
        Math.round(
          .7*
          pxPerMm
        );

      ctx.drawImage(
        source,
        0,
        0,
        source.width,
        source.height,
        x,
        y,
        qrPx,
        qrPx
      );

      ctx.fillStyle='#000';
      ctx.textAlign='center';
      ctx.textBaseline='middle';

      ctx.font=
        'bold '+
        Math.round(
          2.8*
          pxPerMm
        )+
        'px Arial';

      const textY=
        Math.round(
          (
            .7+
            qrMm+
            3
          )*
          pxPerMm
        );

      ctx.fillText(
        plantId,
        widthPx/2,
        textY
      );

      output.toBlob(
        blob=>{
          if(!blob){
            reject(
              new Error(
                'PNG could not be created.'
              )
            );

            return;
          }

          resolve({
            plantId,
            blob
          });
        },
        'image/png'
      );
    }
  );
}

function downloadBlob(
  blob,
  filename
){
  const url=
    URL.createObjectURL(
      blob
    );

  const link=
    document.createElement(
      'a'
    );

  link.href=url;
  link.download=filename;

  document.body.appendChild(
    link
  );

  link.click();
  link.remove();

  setTimeout(
    ()=>{
      URL.revokeObjectURL(
        url
      );
    },
    1000
  );
}

function delay(ms){
  return new Promise(
    resolve=>
      setTimeout(
        resolve,
        ms
      )
  );
}


/* ======================================
   SAVE LABEL STATUS
====================================== */

function saveAndReturn(){
  if(!lastGeneratedIds.length){
    alert(
      'Generate the labels first.'
    );

    return;
  }

  window.location.replace(
    APP_URL+
    '?labelsGenerated='+
    encodeURIComponent(
      lastGeneratedIds.join(',')
    )
  );
}

function returnWithoutSaving(){
  window.location.replace(
    APP_URL
  );
}

function showMessage(message){
  const el=
    document.getElementById(
      'message'
    );

  el.textContent=message;
  el.style.display='block';
}
</script>

</body>
</html>
